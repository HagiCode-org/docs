# profile.yaml — doc-translation profile for repos/docs (human-owned: runs must not modify it).
# Field meanings: .hagicode/skills/doc-translation/references/profile-spec.md
schema: 1
repo: repos/docs
translationsRoot: translations
defaultLocale: en-US                    # SOURCE language is zh-CN (src/content/docs); every locale below is a TARGET
locales:
  en-US:
    name: English (US)
    cjk: false
    notes: "读者称 you;使用美式拼写;标题用句首大写(sentence case),与站点现有英文页一致;不使用全角标点。"
  zh-Hant:
    name: 繁體中文
    cjk: true
    notes: "用台灣慣用詞彙與繁體字形(軟體、專案、設定、網路),全形標點,中英文與數字之間加一個半形空格;讀者稱「你」。"
  ja-JP:
    name: 日本語
    cjk: true
    notes: "文体は「です・ます」調。句読点は「、」「。」。読者への呼びかけは省略するのが基本で、必要なら「あなた」を避ける。用語と言い回しは既存の日本語ページに合わせる。"
  ko-KR:
    name: 한국어
    cjk: true
    notes: "문체는 사이트의 기존 번역과 같은 합쇼체(\"-합니다\")로 통일한다. 한글과 영문·숫자 사이는 한 칸 띄운다."
  de-DE:
    name: Deutsch
    cjk: false
    notes: "Anrede \"Sie\"; deutsche Rechtschreibung; Nomen großschreiben; Überschriften im Satzstil wie in den vorhandenen Seiten."
  fr-FR:
    name: Français
    cjk: false
    notes: "Vouvoiement (\"vous\"); espace insécable avant les deux-points, point-virgule, point d'exclamation et d'interrogation comme dans les pages existantes; titres en casse de phrase."
  es-ES:
    name: Español (España)
    cjk: false
    notes: "Trato neutro/impersonal como en las páginas existentes; signos de apertura ¿ ¡; títulos con mayúscula inicial solo en la primera palabra."
  pt-BR:
    name: Português (Brasil)
    cjk: false
    notes: "Tratamento por \"você\"; ortografia do Brasil; títulos em caixa de frase."
  ru-RU:
    name: Русский
    cjk: false
    notes: "Обращение на \"вы\"; заголовки с заглавной буквы только у первого слова; кавычки-«ёлочки»."

sources:
  description: 简体中文(zh-CN)基线文档,位于 src/content/docs/(不含 blog/、img/ 与各语言目录),共 49 篇;这是唯一的源语言,en-US 在这里是译文而不是源。
  discovery:
    cwd: .
    command: node translations/discover.mjs --locale {locale}
  extensions: [.md, .mdx]

# 站点里已有、且不比中文基线旧的译文视为"外部已提供"(discover.mjs 用 git 提交时间判定):不翻译、不改写。
# 缺失的、或中文基线更新后落后的,才交给技能;重译时以站点里的旧译文为底稿,见 rules.extra。
externalTranslations:
  policy: skip
  evidence:
    - src/content/translations/docs/{locale}/

# 技能的成品先落在 translations/locales/<locale>/content/,再由 publish.mjs 改写站内链接后复制到站点目录。
# 一次运行只写所选语言的两处:translations/locales/<locale>/ 与 src/content/translations/docs/<locale>/。
writeScope:
  - translations/locales/
  - src/content/translations/docs/
readOnly:
  - src/content/docs/                    # 中文基线(含其下各语言目录与 blog/、img/)
  - src/content/.generated/
  - src/i18n/
  - src/components/
  - src/assets/
  - scripts/
  - hagi18n.yaml
  - package.json
  - pnpm-lock.yaml
  - translations/profile.yaml
  - translations/lib.mjs
  - translations/discover.mjs
  - translations/publish.mjs
  - translations/README.md
forbidden:
  - repos/hagicode-local-deployment/.generated/environments/dev-a   # 本机在用的部署:不读、不写、不重启、不按名字杀进程
  - git push / stash / reset / checkout / 新建分支 / --no-verify
  - pnpm install / 构建 / astro / 长时间服务;不要运行 translate:missing:pi 与 translate:missing:claude(翻译由技能自己完成)

priority:                                # 先让新用户路径上的页面保持最新
  - { tier: 1, match: ["quick-start/", "installation/", "product-overview.mdx", "user-guide/index.mdx"] }
  - { tier: 2, match: ["user-guide/", "guides/", "faq/", "ai-service-subscriptions/", "bundles/", "dlc/"] }
  - { tier: 4, match: ["legal/", "release-notes/"] }   # 法律文本不适合无人值守翻译;未匹配的默认第 3 层

budgets:
  maxRunMinutes: 90
  maxDocs: 8
  maxSourceBytes: 60000
  minMinutesToStartDoc: 15

commit:
  enabled: true
  messagePrefix: "docs(translation)"
  trailer: ""                            # 留空:沿用调用会话要求的署名

timezone: America/Los_Angeles

rules:
  doNotTranslateSeeds: [HagiCode, Hagicoder, HagiTask, MonoSpecs, OpenSpec, OmniRoute, Spec Kit, Claude Code, Codex, Hagicode Server, Agent CLI, Node.js, Microsoft Store, Steam, Desktop, Vault]
  links: |
    链接目标(站内绝对路径、相对路径、图片路径、外部网址)逐字与中文源文保持一致——硬校验就是这么要求的。
    站点需要的调整(语言前缀 /<locale>/、相对图片多一层 ../、跨文档锚点换成译文标题的 slug、
    openspec/omniroute.hagicode.com 的语言段)由 translations/publish.mjs 在复制到站点目录时统一完成,不要手工改。
    唯一例外是指向**本篇**标题的 #fragment:按技能的规则改成译文标题的实际 slug。
    代码里的语言参数(locale="zh-CN"、{ locale: 'zh-CN' })同样保持源文原样,publish.mjs 会改成目标语言(产品视频组件只有 zh-CN 与 en,非中文一律用 en)。
  frontmatterTranslatable: [title, description, sidebar_label]
  extra:
    - 源语言是简体中文,不是英文。读中文基线,不要去读某个语言的现有译文来推断原意(旧译文只作重译时的底稿与术语证据)。
    - 重译(站点里已有旧译文)时,以旧译文为底稿:先用 `git -C . diff <旧译文最近提交>..HEAD -- src/content/docs/<doc>` 看中文基线改了什么,只改变化的部分,其余旧译文原样保留(措辞与术语沿用)。基线改动不影响含义(只是格式、空白、标点)时,也要把旧译文走完硬校验并记账为 done,不要留着不处理。
    - 译文里的 `import` 语句、MDX 组件标签与属性名、frontmatter 的键与顺序、`sidebar.order` 等非文字值保持原样;LinkCard、Card 等组件里的 title、description、label 等用户可见文字要翻译。
    - 站点的产品界面术语(按钮、菜单名)以对应语言的界面文案为准:查 src/i18n/locales/<locale>/*.yml(只读)取现成译法,查不到再按术语表翻译。界面里的按钮名在中文源文里常用「」或粗体标出,保持这种强调形式。
    - legal/ 下的法律文档(eula、privacy-policy)若被选中,逐句忠实翻译并在 flags 里加 legal-review,不要意译。
    - 译文通过硬校验后,运行 `node translations/publish.mjs --locale <locale> --doc <doc>` 把它改写并复制到 src/content/translations/docs/<locale>/<doc>;记下它输出的 warnings(例如无法映射的跨文档锚点),写进运行记录与 flags。每一篇完成就发布一篇,不攒到最后。
    - 收尾检查(只读):运行 `node scripts/report-docs-translation-status.mjs --fail-on-findings --report-json <运行记录目录之外的临时文件>` 与 `node scripts/verify-docs-image-references.mjs`,把结果写进运行记录;报告里仍有的发现如实列出,不为变绿放宽脚本或改基线。
    - 提交只含所选语言的两处:`translations/locales/<locale>/` 与 `src/content/translations/docs/<locale>/`(以此替代 writeScope 的整体路径);仓库里还有别的会话留下的未提交改动,不要带上。人维护的文件(profile.yaml、lib.mjs、discover.mjs、publish.mjs、README.md)不在运行的提交里。
