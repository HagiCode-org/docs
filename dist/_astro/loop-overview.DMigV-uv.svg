<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI','Inter','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title id="t">Claude 参与的八阶段迭代循环</title>
<desc id="d">八个阶段排成两行：探索、计划、调研、执行在上一行从左到右，验证、发布、度量、学习在下一行从右到左，学习的结论回到探索，形成闭环。计划和发布两处需要人工批准。</desc>
<defs><marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1.5" y="1.5" width="1197" height="672" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
<text x="600" y="62" font-size="36" font-weight="700" fill="#0f172a" text-anchor="middle">Claude 参与的八阶段迭代循环</text>
<rect x="65" y="128" width="236" height="156" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="183" y="182.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">1 探索</text>
<text x="183" y="216.46" font-size="22" fill="#0f172a" text-anchor="middle">读现状、做审计</text>
<text x="183" y="248.46" font-size="22" fill="#475569" text-anchor="middle">产出：现状报告</text>
<rect x="343" y="128" width="236" height="156" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
<text x="461" y="182.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">2 计划</text>
<text x="461" y="216.46" font-size="22" fill="#0f172a" text-anchor="middle">定目标和验收标准</text>
<text x="461" y="248.46" font-size="22" fill="#475569" text-anchor="middle">产出：本轮计划</text>
<rect x="621" y="128" width="236" height="156" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="739" y="182.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">3 调研</text>
<text x="739" y="216.46" font-size="22" fill="#0f172a" text-anchor="middle">采集并核对来源</text>
<text x="739" y="248.46" font-size="22" fill="#475569" text-anchor="middle">产出：研究笔记</text>
<rect x="899" y="128" width="236" height="156" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="1017" y="182.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">4 执行</text>
<text x="1017" y="216.46" font-size="22" fill="#0f172a" text-anchor="middle">写内容、改代码</text>
<text x="1017" y="248.46" font-size="22" fill="#475569" text-anchor="middle">产出：待验证的改动</text>
<rect x="899" y="408" width="236" height="156" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="1017" y="462.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">5 验证</text>
<text x="1017" y="496.46" font-size="22" fill="#0f172a" text-anchor="middle">构建、预览、检查</text>
<text x="1017" y="528.46" font-size="22" fill="#475569" text-anchor="middle">产出：检查结果</text>
<rect x="621" y="408" width="236" height="156" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
<text x="739" y="462.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">6 发布</text>
<text x="739" y="496.46" font-size="22" fill="#0f172a" text-anchor="middle">推送并复查线上</text>
<text x="739" y="528.46" font-size="22" fill="#475569" text-anchor="middle">产出：线上版本</text>
<rect x="343" y="408" width="236" height="156" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
<text x="461" y="462.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">7 度量</text>
<text x="461" y="496.46" font-size="22" fill="#0f172a" text-anchor="middle">看搜索与行为数据</text>
<text x="461" y="528.46" font-size="22" fill="#475569" text-anchor="middle">产出：数据快照</text>
<rect x="65" y="408" width="236" height="156" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
<text x="183" y="462.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">8 学习</text>
<text x="183" y="496.46" font-size="22" fill="#0f172a" text-anchor="middle">记下结论与下一步</text>
<text x="183" y="528.46" font-size="22" fill="#475569" text-anchor="middle">产出：更新的上下文</text>
<path d="M305 206 L339 206" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M583 206 L617 206" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M861 206 L895 206" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M895 486 L861 486" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M617 486 L583 486" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M339 486 L305 486" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M1017 288 L1017 404" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M183 404 L183 288" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="600" y="352" font-size="24" fill="#475569" text-anchor="middle">每一轮只前进一个小目标；证据不足，就退回调研</text>
<rect x="407" y="95" width="108" height="34" rx="17" fill="#be123c"/>
<text x="461" y="119" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">你来批准</text>
<rect x="685" y="567" width="108" height="34" rx="17" fill="#be123c"/>
<text x="739" y="591" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">你来批准</text>
<text x="600" y="636" font-size="22" fill="#475569" text-anchor="middle">“你来批准”的两处：动手之前确认计划，上线之前确认结果</text>
</svg>
