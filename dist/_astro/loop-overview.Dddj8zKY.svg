<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI','Inter','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title id="t">The iteration loop with Claude</title>
<desc id="d">Eight stages in two rows. Explore, Plan, Research and Build run left to right on the top row; Verify, Publish, Measure and Learn run right to left on the bottom row, and Learn feeds back into Explore. You approve the plan and the publish step.</desc>
<defs><marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1.5" y="1.5" width="1197" height="672" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
<text x="600" y="62" font-size="36" font-weight="700" fill="#0f172a" text-anchor="middle">The iteration loop with Claude</text>
<rect x="55" y="128" width="244" height="156" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="177" y="182.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">1 Explore</text>
<text x="177" y="216.46" font-size="22" fill="#0f172a" text-anchor="middle">Read and audit</text>
<text x="177" y="248.46" font-size="22" fill="#475569" text-anchor="middle">→ Audit report</text>
<rect x="337" y="128" width="244" height="156" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
<text x="459" y="182.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">2 Plan</text>
<text x="459" y="216.46" font-size="22" fill="#0f172a" text-anchor="middle">Goal and criteria</text>
<text x="459" y="248.46" font-size="22" fill="#475569" text-anchor="middle">→ Plan file</text>
<rect x="619" y="128" width="244" height="156" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="741" y="182.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">3 Research</text>
<text x="741" y="216.46" font-size="22" fill="#0f172a" text-anchor="middle">Sourced research</text>
<text x="741" y="248.46" font-size="22" fill="#475569" text-anchor="middle">→ Research notes</text>
<rect x="901" y="128" width="244" height="156" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="1023" y="182.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">4 Build</text>
<text x="1023" y="216.46" font-size="22" fill="#0f172a" text-anchor="middle">Write and change</text>
<text x="1023" y="248.46" font-size="22" fill="#475569" text-anchor="middle">→ Draft changes</text>
<rect x="901" y="408" width="244" height="156" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="1023" y="462.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">5 Verify</text>
<text x="1023" y="496.46" font-size="22" fill="#0f172a" text-anchor="middle">Build and preview</text>
<text x="1023" y="528.46" font-size="22" fill="#475569" text-anchor="middle">→ Check results</text>
<rect x="619" y="408" width="244" height="156" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
<text x="741" y="462.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">6 Publish</text>
<text x="741" y="496.46" font-size="22" fill="#0f172a" text-anchor="middle">Push and recheck</text>
<text x="741" y="528.46" font-size="22" fill="#475569" text-anchor="middle">→ Live version</text>
<rect x="337" y="408" width="244" height="156" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
<text x="459" y="462.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">7 Measure</text>
<text x="459" y="496.46" font-size="22" fill="#0f172a" text-anchor="middle">Search and usage</text>
<text x="459" y="528.46" font-size="22" fill="#475569" text-anchor="middle">→ Data snapshot</text>
<rect x="55" y="408" width="244" height="156" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
<text x="177" y="462.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">8 Learn</text>
<text x="177" y="496.46" font-size="22" fill="#0f172a" text-anchor="middle">Record next steps</text>
<text x="177" y="528.46" font-size="22" fill="#475569" text-anchor="middle">→ Updated notes</text>
<path d="M303 206 L333 206" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M585 206 L615 206" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M867 206 L897 206" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M897 486 L867 486" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M615 486 L585 486" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M333 486 L303 486" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M1023 288 L1023 404" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M177 404 L177 288" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="600" y="352" font-size="24" fill="#475569" text-anchor="middle">One small goal per round. Weak evidence? Back to research.</text>
<rect x="376.79999999999995" y="95" width="164.40000000000003" height="34" rx="17" fill="#be123c"/>
<text x="459" y="119" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">You approve</text>
<rect x="658.8" y="567" width="164.40000000000003" height="34" rx="17" fill="#be123c"/>
<text x="741" y="591" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">You approve</text>
<text x="600" y="636" font-size="22" fill="#475569" text-anchor="middle">You approve twice: the plan before work starts, the result before it goes live</text>
</svg>
