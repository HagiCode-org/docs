# pnpm settings (pnpm 12 reads these here, not from package.json).
# Replaces the npm `overrides` field.
overrides:
  vite: ^8.0.1

# Dependency lifecycle scripts run only for approved packages. Reviewed from the old lockfile's
# `hasInstallScript` entries:
#   esbuild  - its install step selects/verifies the platform binary.
#   sharp    - needs its install step to fetch/verify the native libvips binding.
#   fsevents - macOS-only optional file watcher; ships a prebuilt binary, no script needed.
allowBuilds:
  esbuild: true
  sharp: true
  fsevents: false

# Layout workaround (tool requirement, not a ghost-dependency cover-up): the local starlight-blog fork in
# src/integrations/starlight-blog-no-tags imports starlight-blog's TypeScript sources through the relative
# path ../../../node_modules/starlight-blog/..., so `tsc` resolves their imports from the symlink location
# and only finds packages that sit at the root of node_modules. These two are starlight-blog's own
# dependencies; the build itself resolves them from the real package location and does not need this.
publicHoistPattern:
  - satteri
  - mdast-util-mdx-expression

# pnpm 12 rejects packages younger than its default minimumReleaseAge (1 day). First-party packages
# are published and consumed the same day, so exempt only that scope.
minimumReleaseAgeExclude:
  - "@hagicode/*"

# Agent skills shipped inside dependencies are not installed into the repository (reviewed: denied).
permissions:
  '@hagicode/hagi18n':
    skills: false
