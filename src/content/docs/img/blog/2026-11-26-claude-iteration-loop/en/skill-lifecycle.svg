<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI','Inter','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title id="t">The life of a skill</title>
<desc id="d">Row one runs left to right: find, review, install. Row two runs right to left: try, capture, share. Three labels at the bottom show where skills live: personal folder, project folder and plugins.</desc>
<defs><marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1.5" y="1.5" width="1197" height="672" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
<text x="600" y="62" font-size="36" font-weight="700" fill="#0f172a" text-anchor="middle">The life of a skill</text>
<rect x="45" y="116" width="330" height="150" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="210" y="167.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">1 Find</text>
<text x="210" y="201.46" font-size="22" fill="#0f172a" text-anchor="middle">Marketplace or directory</text>
<text x="210" y="233.46" font-size="22" fill="#0f172a" text-anchor="middle">or a GitHub repository</text>
<rect x="435" y="116" width="330" height="150" rx="14" fill="#ffe4e6" stroke="#be123c" stroke-width="2.5"/>
<text x="600" y="167.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">2 Review</text>
<text x="600" y="201.46" font-size="22" fill="#0f172a" text-anchor="middle">Read SKILL.md, scripts</text>
<text x="600" y="233.46" font-size="22" fill="#0f172a" text-anchor="middle">Check access and network</text>
<rect x="825" y="116" width="330" height="150" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="990" y="167.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">3 Install</text>
<text x="990" y="201.46" font-size="22" fill="#0f172a" text-anchor="middle">Project scope first</text>
<text x="990" y="233.46" font-size="22" fill="#0f172a" text-anchor="middle">Other projects untouched</text>
<rect x="825" y="348" width="330" height="150" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="990" y="399.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">4 Try</text>
<text x="990" y="433.46" font-size="22" fill="#0f172a" text-anchor="middle">Real task, side by side</text>
<text x="990" y="465.46" font-size="22" fill="#0f172a" text-anchor="middle">With and without it</text>
<rect x="435" y="348" width="330" height="150" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
<text x="600" y="399.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">5 Capture</text>
<text x="600" y="433.46" font-size="22" fill="#0f172a" text-anchor="middle">Turn a repeated routine</text>
<text x="600" y="465.46" font-size="22" fill="#0f172a" text-anchor="middle">into your own skill</text>
<rect x="45" y="348" width="330" height="150" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
<text x="210" y="399.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">6 Share</text>
<text x="210" y="433.46" font-size="22" fill="#0f172a" text-anchor="middle">Commit it with the repo</text>
<text x="210" y="465.46" font-size="22" fill="#0f172a" text-anchor="middle">or ship it as a plugin</text>
<path d="M379 191 L431 191" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M769 191 L821 191" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M821 423 L769 423" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M431 423 L379 423" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M990 270 L990 344" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="600" y="560" font-size="24" fill="#475569" text-anchor="middle">Where skills live</text>
<rect x="24" y="584" width="372" height="56" rx="28" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
<text x="50" y="619" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Personal</text>
<text x="163.20000000000002" y="619" font-size="20" fill="#0f172a" text-anchor="start" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace">~/.claude/skills/</text>
<rect x="414" y="584" width="372" height="56" rx="28" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
<text x="440" y="619" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Project</text>
<text x="540.8" y="619" font-size="20" fill="#0f172a" text-anchor="start" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace">.claude/skills/</text>
<rect x="804" y="584" width="372" height="56" rx="28" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
<text x="830" y="619" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Plugin</text>
<text x="918.4" y="619" font-size="20" fill="#0f172a" text-anchor="start" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace">/plugin</text>
</svg>
