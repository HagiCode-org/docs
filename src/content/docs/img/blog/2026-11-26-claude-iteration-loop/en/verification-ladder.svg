<text x="202" y="618" font-size="22" fill="#475569" text-anchor="start">Queries, GA events, AI answers naming you</text>
<rect x="1000" y="575" width="140" height="36" rx="18" fill="#b45309"/>
<text x="1070" y="600.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Weeks</text>
<path d="M66 108 L66 628" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<text transform="translate(40 334) rotate(-90)" font-size="22" fill="#475569" text-anchor="middle">Lower = closer to reality, slower</text>
