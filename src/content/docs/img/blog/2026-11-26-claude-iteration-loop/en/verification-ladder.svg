<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI','Inter','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title id="t">The verification ladder</title>
<desc id="d">Six checks from top to bottom: local build, deployment, live page, external tools, search engine indexing and real results. Lower rungs are closer to real results but take longer to show.</desc>
<defs><marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1.5" y="1.5" width="1197" height="672" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
<text x="600" y="62" font-size="36" font-weight="700" fill="#0f172a" text-anchor="middle">The verification ladder</text>
<rect x="120" y="104" width="1040" height="78" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<circle cx="160" cy="143" r="21" fill="#15803d"/>
<text x="160" y="151" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="202" y="138" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Local build passes</text>
<text x="202" y="168" font-size="22" fill="#475569" text-anchor="start">npm run build has no errors</text>
<rect x="1000" y="125" width="140" height="36" rx="18" fill="#15803d"/>
<text x="1070" y="150.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Instant</text>
<rect x="120" y="194" width="1040" height="78" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<circle cx="160" cy="233" r="21" fill="#15803d"/>
<text x="160" y="241" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="202" y="228" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Deployment succeeds</text>
<text x="202" y="258" font-size="22" fill="#475569" text-anchor="start">GitHub Actions and Cloudflare both finish</text>
<rect x="1000" y="215" width="140" height="36" rx="18" fill="#15803d"/>
<text x="1070" y="240.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Instant</text>
<rect x="120" y="284" width="1040" height="78" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<circle cx="160" cy="323" r="21" fill="#15803d"/>
<text x="160" y="331" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="202" y="318" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Live page is correct</text>
<text x="202" y="348" font-size="22" fill="#475569" text-anchor="start">curl checks status, tags and body text</text>
<rect x="1000" y="305" width="140" height="36" rx="18" fill="#15803d"/>
<text x="1070" y="330.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Instant</text>
<rect x="120" y="374" width="1040" height="78" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="160" cy="413" r="21" fill="#2563eb"/>
<text x="160" y="421" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="202" y="408" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">External checks pass</text>
<text x="202" y="438" font-size="22" fill="#475569" text-anchor="start">Structured data, PageSpeed, link checks</text>
<rect x="1000" y="395" width="140" height="36" rx="18" fill="#2563eb"/>
<text x="1070" y="420.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Same day</text>
<rect x="120" y="464" width="1040" height="78" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
<circle cx="160" cy="503" r="21" fill="#b45309"/>
<text x="160" y="511" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="202" y="498" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Search engine indexed it</text>
<text x="202" y="528" font-size="22" fill="#475569" text-anchor="start">Search Console pages and sitemaps</text>
