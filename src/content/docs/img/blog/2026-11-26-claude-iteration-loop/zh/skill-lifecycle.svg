<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI','Inter','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title id="t">技能的生命周期</title>
<desc id="d">第一行从左到右是寻找、审查、安装；第二行从右到左是试跑、沉淀、分享。底部三个标签给出技能的存放位置：个人目录、项目目录和插件。</desc>
<defs><marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1.5" y="1.5" width="1197" height="672" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
<text x="600" y="62" font-size="36" font-weight="700" fill="#0f172a" text-anchor="middle">技能的生命周期</text>
<rect x="45" y="116" width="330" height="150" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="210" y="167.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">1 寻找</text>
<text x="210" y="201.46" font-size="22" fill="#0f172a" text-anchor="middle">插件市场、社区目录</text>
<text x="210" y="233.46" font-size="22" fill="#0f172a" text-anchor="middle">或 GitHub 仓库</text>
<rect x="435" y="116" width="330" height="150" rx="14" fill="#ffe4e6" stroke="#be123c" stroke-width="2.5"/>
<text x="600" y="167.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">2 审查</text>
<text x="600" y="201.46" font-size="22" fill="#0f172a" text-anchor="middle">读 SKILL.md 和脚本</text>
<text x="600" y="233.46" font-size="22" fill="#0f172a" text-anchor="middle">确认权限与联网</text>
<rect x="825" y="116" width="330" height="150" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="990" y="167.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">3 安装</text>
<text x="990" y="201.46" font-size="22" fill="#0f172a" text-anchor="middle">先装到当前项目</text>
<text x="990" y="233.46" font-size="22" fill="#0f172a" text-anchor="middle">不影响其他项目</text>
<rect x="825" y="348" width="330" height="150" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="990" y="399.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">4 试跑</text>
<text x="990" y="433.46" font-size="22" fill="#0f172a" text-anchor="middle">用真实任务对比</text>
<text x="990" y="465.46" font-size="22" fill="#0f172a" text-anchor="middle">有技能与无技能</text>
<rect x="435" y="348" width="330" height="150" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
<text x="600" y="399.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">5 沉淀</text>
<text x="600" y="433.46" font-size="22" fill="#0f172a" text-anchor="middle">把重复流程写成</text>
<text x="600" y="465.46" font-size="22" fill="#0f172a" text-anchor="middle">自己的项目技能</text>
<rect x="45" y="348" width="330" height="150" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
<text x="210" y="399.96" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">6 分享</text>
<text x="210" y="433.46" font-size="22" fill="#0f172a" text-anchor="middle">随仓库提交</text>
<text x="210" y="465.46" font-size="22" fill="#0f172a" text-anchor="middle">或打包成插件</text>
<path d="M379 191 L431 191" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M769 191 L821 191" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M821 423 L769 423" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M431 423 L379 423" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M990 270 L990 344" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="600" y="560" font-size="24" fill="#475569" text-anchor="middle">技能存放的位置</text>
<rect x="24" y="584" width="372" height="56" rx="28" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
<text x="50" y="619" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">个人</text>
<text x="104" y="619" font-size="20" fill="#0f172a" text-anchor="start" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace">~/.claude/skills/</text>
<rect x="414" y="584" width="372" height="56" rx="28" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
<text x="440" y="619" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">项目</text>
<text x="494" y="619" font-size="20" fill="#0f172a" text-anchor="start" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace">.claude/skills/</text>
<rect x="804" y="584" width="372" height="56" rx="28" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
<text x="830" y="619" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">插件</text>
<text x="884" y="619" font-size="20" fill="#0f172a" text-anchor="start" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace">/plugin</text>
</svg>
