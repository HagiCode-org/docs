name: IndexNow Submission

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  submit:
    name: Submit production docs URLs
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify install and lockfile stability
        run: |
          test -d node_modules
          git diff --exit-code -- pnpm-lock.yaml

      - name: Registry neutrality
        run: pnpm run check:registry

      - name: Submit production URLs to IndexNow
        run: pnpm run indexnow:submit
