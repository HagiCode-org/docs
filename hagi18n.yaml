doctor:
  excludedDirectories:
    - .astro
    - .git
    - .tmp
    - build
    - coverage
    - dist
    - node_modules
    - public
  excludedPathPrefixes:
    - src/content/docs/
    - src/i18n/generated/
  textFileExtensions:
    - .astro
    - .css
    - .js
    - .jsx
    - .json
    - .mjs
    - .ts
    - .tsx
    - .yaml
    - .yml
  allowlist:
    legacy-language-change-call: []
    legacy-locale-path:
      - src/lib/i18n.ts
    legacy-ui-language-literal:
      - astro.config.mjs
      - src/lib/i18n.ts
      - src/lib/i18n.test.ts
    legacy-ui-language-union:
      - src/lib/i18n.ts
