localesRoot: src/i18n/locales
repoRoot: .
baseLocale: en-US
targetLocales:
  - zh-CN
  - zh-Hant
  - ja-JP
  - ko-KR
  - de-DE
  - fr-FR
  - es-ES
  - pt-BR
  - ru-RU
# 与英文基线相同、且在各语言里本就应当相同的值(品牌名、URL、技术标识、通用借词等),按「文件 → 键」逐条精确列出,每条写理由。
# 名单对所有目标语言生效:只有在所有仍与英文相同的语言里英文写法都正确时才加入;其余一律翻译。
auditIdenticalAllowlist:
  blog.yml:
    - plugin.title # de/fr/es/pt通用借词Blog
    - ui.starlightBlog.post.date # 日期格式占位符
    - ui.starlightBlog.post.tags # de/pt通用借词Tags
    - ui.starlightBlog.sidebar.rss # 技术标识RSS
    - ui.starlightBlog.sidebar.tags # de/pt通用借词Tags
  common.yml:
    - footer.blogLink # de/fr/es/pt通用借词Blog
    - languageSelect.englishOptionLabel # 语言切换标签
    - languageSelect.rootOptionLabel # 语言切换标签
